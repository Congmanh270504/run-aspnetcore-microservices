version: '3.4'

services:
  # --- LOCAL DATABASES (Comment lai vi da dung Cloud: Atlas, Supabase, Aiven, Upstash) ---
  # catalogdb:
  #   container_name: catalogdb
  #   restart: always
  #   ports:
  #     - "27017:27017"
  # basketdb:
  #   container_name: basketdb
  #   restart: always
  #   ports:
  #     - "5433:5432"
  # distributedcache:
  #   container_name: distributedcache
  #   restart: always
  #   ports:
  #     - "6379:6379"
  # orderdb:
  #   container_name: orderdb
  #   restart: always
  #   ports:
  #     - "3306:3306"

  messagebroker:
    container_name: messagebroker
    hostname: ecommerce-mq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=${CATALOG_DB_CONN:-mongodb://catalogdb:27017/CatalogDb}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/run-aspnetcore-microservices.pfx
    ports:
      - "6000:8080"
      - "6060:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro

  basket.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=${BASKET_DB_CONN:-Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true}
      - ConnectionStrings__Redis=${REDIS_CONN:-distributedcache:6379}
      - GrpcSettings__DiscountUrl=${DISCOUNT_GRPC_URL:-https://discount.grpc:8081}
      - MessageBroker__Host=${RABBITMQ_HOST:-amqp://ecommerce-mq:5672}
      - MessageBroker__UserName=${RABBITMQ_USERNAME:-guest}
      - MessageBroker__Password=${RABBITMQ_PASSWORD:-guest}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/run-aspnetcore-microservices.pfx
    depends_on:
      - discount.grpc
      - messagebroker
    ports:
      - "6001:8080"
      - "6061:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro

  discount.grpc:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=${DISCOUNT_DB_CONN:-Data Source=discountdb}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/run-aspnetcore-microservices.pfx
    ports:
      - "6002:8080"
      - "6062:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro

  ordering.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=${ORDERING_DB_CONN:-Server=orderdb;Port=3306;Database=OrderDb;User=root;Password=root;}
      - MessageBroker__Host=${RABBITMQ_HOST:-amqp://ecommerce-mq:5672}
      - MessageBroker__UserName=${RABBITMQ_USERNAME:-guest}
      - MessageBroker__Password=${RABBITMQ_PASSWORD:-guest}
      - FeatureManagement__OrderFullfilment=false
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/run-aspnetcore-microservices.pfx
    depends_on:
      - messagebroker
    ports:
      - "6003:8080"
      - "6063:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro

  yarpapigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/run-aspnetcore-microservices.pfx
    depends_on:
      - catalog.api
      - basket.api
      - ordering.api
    ports:
      - "6004:8080"
      - "6064:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro

  # shopping.web: (Legacy MVC/Razor UI - da thay the bang Next.js shopping.client)

  shopping.client:
    environment:
      - NODE_ENV=production
      - API_GATEWAY_URL=${API_GATEWAY_URL:-http://yarpapigateway:8080}
    depends_on:
      - yarpapigateway
    ports:
      - "${CLIENT_PORT:-3000}:3000"

