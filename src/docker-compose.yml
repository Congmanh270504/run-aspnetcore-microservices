version: '3.4'

services:
  # --- LOCAL DATABASES (Đã comment lại vì đang dùng Cloud DB: MongoDB Atlas, Supabase, Aiven MySQL, Upstash Redis) ---
  # catalogdb:
  #   image: mongo:7
  # basketdb:
  #   image: postgres:16
  # distributedcache:
  #   image: redis
  # orderdb:
  #   image: mysql:8.0

  messagebroker:
    image: rabbitmq:management

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile

  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile

  discount.grpc:
    image: ${DOCKER_REGISTRY-}discountgrpc
    build:
      context: .
      dockerfile: Services/Discount/Discount.Grpc/Dockerfile

  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    build:
      context: .
      dockerfile: Services/Ordering/Ordering.API/Dockerfile

  yarpapigateway:
    image: ${DOCKER_REGISTRY-}yarpapigateway
    build:
      context: .
      dockerfile: ApiGateways/YarpApiGateway/Dockerfile

  # shopping.web: (Legacy Razor UI)
  #   image: ${DOCKER_REGISTRY-}shoppingweb
  #   build:
  #     context: .
  #     dockerfile: WebApps/Shopping.Web/Dockerfile

  shopping.client:
    image: ${DOCKER_REGISTRY-}shoppingclient
    build:
      context: .
      dockerfile: Client/Dockerfile

volumes:
  postgres_catalog:
  postgres_basket:






